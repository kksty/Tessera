name: tessera

# 镜像由本机从当前源码构建；docker compose up -d 在镜像不存在时自动构建。
# 更新代码后重建：git pull && docker compose up -d --build。
# TESSERA_IMAGE_TAG 只是本地镜像标签（默认 latest），用于回退，不指向任何 Registry。
# 改用外部镜像：在 .env 设置 TESSERA_APP_IMAGE / TESSERA_WORKER_IMAGE 为完整引用。
x-images:
  app: &app-image ${TESSERA_APP_IMAGE:-tessera-server:${TESSERA_IMAGE_TAG:-latest}}
  worker: &worker-image ${TESSERA_WORKER_IMAGE:-tessera-runtime:${TESSERA_IMAGE_TAG:-latest}}
x-build:
  app: &app-build
    context: .
    dockerfile: Dockerfile
    args:
      DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://deb.debian.org}
      COREPACK_NPM_REGISTRY: ${COREPACK_NPM_REGISTRY:-https://registry.npmjs.org}
  worker: &worker-build
    context: .
    dockerfile: docker/worker.Dockerfile
    target: ${TESSERA_WORKER_TARGET:-runtime}
    args:
      DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://deb.debian.org}
      KALI_MIRROR: ${KALI_MIRROR:-http://http.kali.org/kali}
      COREPACK_NPM_REGISTRY: ${COREPACK_NPM_REGISTRY:-https://registry.npmjs.org}

services:
  tessera-server:
    image: *app-image
    build: *app-build
    ports:
      - "${TESSERA_BIND_ADDRESS:-127.0.0.1}:${TESSERA_PORT:-8000}:8000"
    environment:
      TESSERA_DB: /data/tessera.db
      TESSERA_EVENT_HOT_DAYS: ${TESSERA_EVENT_HOT_DAYS:-90}
      TESSERA_DIAGNOSTIC_HOT_DAYS: ${TESSERA_DIAGNOSTIC_HOT_DAYS:-30}
      TESSERA_EVIDENCE_HOT_DAYS: ${TESSERA_EVIDENCE_HOT_DAYS:-30}
      TESSERA_ARCHIVE_BATCH: ${TESSERA_ARCHIVE_BATCH:-1000}
      TESSERA_LOG_LEVEL: ${TESSERA_LOG_LEVEL:-info}
      TESSERA_CONFIG: /data/runtime.json
      TESSERA_INTERNAL_URL: ${TESSERA_INTERNAL_URL:-}
      TESSERA_DISPATCHER_URL: http://tessera-dispatcher:8001
      TESSERA_NETWORK: ${TESSERA_NETWORK:-}
      TESSERA_WORKER_IMAGE: *worker-image
      TESSERA_VOLUME_PREFIX: ${TESSERA_VOLUME_PREFIX:-}
      TESSERA_MAX_WORKERS: ${TESSERA_MAX_WORKERS:-}
      TESSERA_MAX_PROJECT_WORKERS: ${TESSERA_MAX_PROJECT_WORKERS:-}
      TESSERA_MAX_PROJECT_REVIEW_WORKERS: ${TESSERA_MAX_PROJECT_REVIEW_WORKERS:-}
      TESSERA_INTERVAL_MS: ${TESSERA_INTERVAL_MS:-}
      TESSERA_DEBOUNCE_MS: ${TESSERA_DEBOUNCE_MS:-}
      TESSERA_TASK_TIMEOUT_SECONDS: ${TESSERA_TASK_TIMEOUT_SECONDS:-}
      TESSERA_CLOSEOUT_SECONDS: ${TESSERA_CLOSEOUT_SECONDS:-}
      TESSERA_TOOL_TIMEOUT_SECONDS: ${TESSERA_TOOL_TIMEOUT_SECONDS:-}
      TESSERA_RESULT_REPAIRS: ${TESSERA_RESULT_REPAIRS:-}
      # 部署侧强制关闭信息类免审（true/false）；设置后该项在 UI 只读。
      TESSERA_SKIP_INFORMATIONAL_REVIEW: ${TESSERA_SKIP_INFORMATIONAL_REVIEW:-}
      # 控制面/模型超时预算；默认值见 packages/protocol/src/timeouts.ts。
      TESSERA_LEASE_SECONDS: ${TESSERA_LEASE_SECONDS:-}
      TESSERA_COMMIT_TIMEOUT_MS: ${TESSERA_COMMIT_TIMEOUT_MS:-}
      TESSERA_USAGE_TIMEOUT_MS: ${TESSERA_USAGE_TIMEOUT_MS:-}
      TESSERA_DIAGNOSTICS_TIMEOUT_MS: ${TESSERA_DIAGNOSTICS_TIMEOUT_MS:-}
      TESSERA_MODEL_TIMEOUT_MS: ${TESSERA_MODEL_TIMEOUT_MS:-}
      TESSERA_WORKER_TOKEN: ${TESSERA_WORKER_TOKEN:-}
      TESSERA_TOKEN_FILE: /data/internal-token
      # 单账号登录门：留空则首次启动自动生成，并只在容器日志里打印一次。
      TESSERA_OPERATOR_USER: ${TESSERA_OPERATOR_USER:-}
      TESSERA_OPERATOR_PASSWORD: ${TESSERA_OPERATOR_PASSWORD:-}
      TESSERA_COOKIE_SECURE: ${TESSERA_COOKIE_SECURE:-}
      PI_MODEL: ${PI_MODEL:-}
      PI_PROVIDER: ${PI_PROVIDER:-}
      PI_BASE_URL: ${PI_BASE_URL:-}
      PI_API_KEY: ${PI_API_KEY:-}
      PI_PROVIDER_API: ${PI_PROVIDER_API:-}
      PI_CONTEXT_WINDOW: ${PI_CONTEXT_WINDOW:-}
      PI_MAX_OUTPUT_TOKENS: ${PI_MAX_OUTPUT_TOKENS:-}
      PI_REVIEW_MODEL: ${PI_REVIEW_MODEL:-}
      PI_REVIEW_PROVIDER: ${PI_REVIEW_PROVIDER:-}
      PI_REVIEW_BASE_URL: ${PI_REVIEW_BASE_URL:-}
      PI_REVIEW_API_KEY: ${PI_REVIEW_API_KEY:-}
      PI_REVIEW_PROVIDER_API: ${PI_REVIEW_PROVIDER_API:-}
      PI_REVIEW_CONTEXT_WINDOW: ${PI_REVIEW_CONTEXT_WINDOW:-}
      PI_REVIEW_MAX_OUTPUT_TOKENS: ${PI_REVIEW_MAX_OUTPUT_TOKENS:-}
    volumes:
      - tessera-data:/data
    networks: [tessera]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # A SIGTERM asks the server to close Fastify and checkpoint SQLite; the
    # default 10s grace can kill it mid-checkpoint during a large write burst.
    stop_grace_period: 30s
  tessera-dispatcher:
    image: *app-image
    build: *app-build
    command: ["node", "dist/dispatcher.mjs"]
    environment:
      TESSERA_SERVER: http://tessera-server:8000
      TESSERA_CAPTURE_UPSTREAM: ${TESSERA_CAPTURE_UPSTREAM:-}
      TESSERA_CAPTURE_BYPASS: ${TESSERA_CAPTURE_BYPASS:-}
      TESSERA_CAPTURE_TLS_MAX: ${TESSERA_CAPTURE_TLS_MAX:-}
      TESSERA_WORKER_TOKEN: ${TESSERA_WORKER_TOKEN:-}
      TESSERA_TOKEN_FILE: /data/internal-token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tessera-data:/data
    networks: [tessera]
    depends_on:
      tessera-server:
        condition: service_healthy
      worker-image:
        condition: service_completed_successfully
    restart: unless-stopped
    # Let running tasks finish their abort/release path instead of being killed.
    stop_grace_period: 30s
  # 一次性构建并校验 Worker 镜像；实际项目 Worker 由 Dispatcher 动态创建。
  worker-image:
    image: *worker-image
    build: *worker-build
    command: ["node", "--version"]
    networks: [tessera]
    restart: "no"
volumes:
  # /data is always a Docker named volume. The name is stable across Compose
  # project renames; set TESSERA_DATA_VOLUME only to attach an existing volume.
  # external: Compose never creates or deletes it. Create it once (the migration
  # script does) so `docker compose down -v` cannot destroy platform data.
  tessera-data:
    name: ${TESSERA_DATA_VOLUME:-tessera-data}
    external: true
networks:
  tessera:
    name: ${TESSERA_NETWORK:-tessera-network}
