# 兼容旧命令用的空覆盖层。
#
# 命名卷现在是默认挂载（见 compose.yaml 的 tessera-data）。本文件不再改变任何
# 配置，保留它只是让旧命令仍然可用：
#   docker compose -f compose.yaml -f compose.volume.yaml up -d
#
# 新用法：
#   docker compose up -d
#
# 卷名由 .env 的 TESSERA_DATA_VOLUME 决定（默认 tessera-data）。它不会随
# compose down 删除；换卷名会挂载一个空卷，需要先用
# scripts/ops/migrate-data-to-volume.ps1 迁移数据。
services: {}
