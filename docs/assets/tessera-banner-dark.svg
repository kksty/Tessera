<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Tessera · 探索成图，证据成链">
  <!-- 深色主题版：几何与 tessera-banner.svg 完全一致，只换用深色令牌（#f3f4f8 / #8e94a5 / #8b85ff）；
       底色留空，让 GitHub 深色主题的页面色直接透出，避免出现比页面更深的一条色带。 -->

  <g transform="translate(80 104) scale(2.8)">
    <g fill="#f3f4f8">
      <rect x="4.7" y="4.7" width="8.2" height="8.2" rx="1.45" transform="rotate(45 8.8 8.8)"/>
      <rect x="19.1" y="4.7" width="8.2" height="8.2" rx="1.45" transform="rotate(45 23.2 8.8)"/>
      <rect x="4.7" y="19.1" width="8.2" height="8.2" rx="1.45" transform="rotate(45 8.8 23.2)"/>
    </g>
    <rect x="19.1" y="19.1" width="8.2" height="8.2" rx="1.45" transform="rotate(45 23.2 23.2)" fill="#8b85ff"/>
  </g>

  <g font-family="Geist, 'Segoe UI', -apple-system, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="186" y="158" fill="#f3f4f8" font-size="54" font-weight="600" letter-spacing="-1.3">tessera</text>
    <text x="187" y="194" fill="#c8ccd8" font-size="19" letter-spacing="1">探索成图，证据成链</text>
  </g>

  <g transform="translate(872 60) scale(7.2)" fill="#f3f4f8" fill-opacity="0.07">
    <rect x="4.7" y="4.7" width="8.2" height="8.2" rx="1.45" transform="rotate(45 8.8 8.8)"/>
    <rect x="19.1" y="4.7" width="8.2" height="8.2" rx="1.45" transform="rotate(45 23.2 8.8)"/>
    <rect x="4.7" y="19.1" width="8.2" height="8.2" rx="1.45" transform="rotate(45 8.8 23.2)"/>
    <rect x="19.1" y="19.1" width="8.2" height="8.2" rx="1.45" transform="rotate(45 23.2 23.2)"/>
  </g>
</svg>
