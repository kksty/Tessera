<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Tessera · 探索成图，证据成链">
  <!-- 深色主题版：几何与 tessera-banner.svg 完全一致，只换用深色令牌（#f3f4f8 / #c8ccd8 / #8b85ff）；
       底色留空，让 GitHub 深色主题的页面色直接透出，避免出现比页面更深的一条色带。 -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b85ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8b85ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#f3f4f8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="markClip"><path d="M2.6 2.6H25.4L29.4 6.6V29.4H2.6Z"/></clipPath>
  </defs>

  <rect width="1200" height="320" fill="url(#grid)"/>
  <ellipse cx="955" cy="160" rx="255" ry="180" fill="url(#glow)"/>

  <g transform="translate(88 118) scale(2.9)" clip-path="url(#markClip)">
    <path d="M2.6 2.6H28.2L2.6 28.2Z" fill="#f3f4f8"/>
    <path d="M29.4 29.4H3.8L29.4 3.8Z" fill="#8b85ff"/>
  </g>
  <g font-family="Geist, 'Segoe UI', -apple-system, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="204" y="122" fill="#b3aeff" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="4.2" font-weight="600">OFFENSIVE SECURITY WORKBENCH</text>
    <text x="200" y="178" fill="#f3f4f8" font-size="60" font-weight="600" letter-spacing="-1.6">tessera</text>
    <text x="203" y="212" fill="#c8ccd8" font-size="20" letter-spacing="2.4">探索成图，证据成链</text>
  </g>

  <g stroke-linecap="round">
    <g stroke="#6b7286" stroke-width="1.2" fill="none" stroke-opacity="0.9">
      <path d="M821.5 235.5 L910 160"/>
      <path d="M935.5 87.5 L910 160"/>
    </g>
    <g stroke="#8b85ff" stroke-width="1.7" fill="none">
      <path d="M910 160 L1005.5 197.5"/>
      <path d="M1005.5 197.5 L1080 122"/>
    </g>
  </g>
  <g font-family="'Geist Mono', ui-monospace, monospace" font-size="10.5" letter-spacing="2" fill="#a6adc0">
    <rect x="816" y="230" width="11" height="11" fill="#0f121b" stroke="#f3f4f8" stroke-width="1.4"/>
    <rect x="930" y="82" width="11" height="11" fill="#0f121b" stroke="#f3f4f8" stroke-width="1.4"/>
    <rect x="904" y="154" width="12" height="12" fill="#8b85ff"/>
    <rect x="1000" y="192" width="11" height="11" fill="#0f121b" stroke="#8b85ff" stroke-width="1.4"/>
    <path d="M1080 112 L1090 122 L1080 132 L1070 122 Z" fill="#8b85ff"/>
    <text x="834" y="253">FACT</text>
    <text x="948" y="92">GOAL</text>
    <text x="896" y="150" text-anchor="end">STEP</text>
    <text x="1018" y="214">EVIDENCE</text>
    <text x="1098" y="128">FINDING</text>
  </g>

  <g stroke="#f3f4f8" stroke-opacity="0.2" stroke-width="1.1" fill="none">
    <path d="M772 70V50H792"/><path d="M1138 50H1158V70"/>
    <path d="M772 252V272H792"/><path d="M1138 272H1158V252"/>
  </g>
</svg>
