# 构建并推送预构建镜像到 GHCR。
#
# 触发：
# - main 分支的代码变更：发布 latest 与 sha-<commit>，保证 clone main 后拉到的镜像对应当前代码；
# - v* 标签：额外发布 <version> 标签，用于固定版本部署；
# - 手动运行：发布 latest 与 sha-<commit>。
# 仅文档/测试变更不会触发镜像重建。首次发布后，在 GitHub Packages 中把
# tessera-server / tessera-runtime 的可见性改为 public，否则公开仓库的用户拉取时需要登录。
name: Publish images
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/**"
      - "packages/**"
      - "docker/**"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "scripts/build.mjs"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"
      - id: image
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.image.outputs.owner }}/tessera-server
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ github.ref_type == 'tag' }}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEBIAN_MIRROR=http://deb.debian.org
            COREPACK_NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app
          provenance: false
          sbom: false

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"
      - id: image
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.image.outputs.owner }}/tessera-runtime
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ github.ref_type == 'tag' }}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEBIAN_MIRROR=http://deb.debian.org
            KALI_MIRROR=http://http.kali.org/kali
            COREPACK_NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker
          provenance: false
          sbom: false
