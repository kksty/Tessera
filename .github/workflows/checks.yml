name: Typecheck and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm test:traffic
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:frontend-browser
      - run: pnpm test:deletion-config-browser
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: docker build --target server --build-arg DEBIAN_MIRROR=http://deb.debian.org --build-arg COREPACK_NPM_REGISTRY=https://registry.npmjs.org -t tessera-server:ci .
      # http.kali.org redirects to a geo mirror that is not always reachable from GitHub runners.
      - run: docker build --target runtime --build-arg DEBIAN_MIRROR=http://deb.debian.org --build-arg KALI_MIRROR=http://kali.download/kali --build-arg COREPACK_NPM_REGISTRY=https://registry.npmjs.org -t tessera-runtime:ci .
      # Compose starts one gateway per project and resolves it from this image;
      # without a local tag the QA run tries to pull `tessera-gateway:latest`.
      - run: docker build --target gateway --build-arg KALI_MIRROR=http://kali.download/kali -t tessera-gateway:ci .
      - run: pnpm test:docker
        env:
          TESSERA_APP_IMAGE: tessera-server:ci
          TESSERA_WORKER_IMAGE: tessera-runtime:ci
          TESSERA_GATEWAY_IMAGE: tessera-gateway:ci
